[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-channel-audit"
version = "0.0.1"
description = "Which message content, if any, lets small reasoning agents beat self-consistency at the same token budget?"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are added milestone by milestone.
# pydantic: typed, validated records. math-verify: the grader; pinned exactly
# because a grader upgrade can change which answers count as correct.
# numpy: bootstrap resampling in analysis/stats.py. pyyaml: configs/models/*.yaml.
dependencies = [
    "pydantic>=2.7,<3",
    "math-verify==0.9.0",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# GPU and data extras are unpinned on purpose: Kaggle images ship their own torch,
# and every generation records the backend version it was produced with.
vllm = ["vllm"]
hf = ["torch", "transformers", "accelerate"]
data = ["datasets"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
